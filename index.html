<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rain Station Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2360a5fa'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2308111F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=6e9f0e440b">
</head>
<body>
<header id="top">
  <div class="brand">RAIN BOARD<span>22 settlement gauges</span></div>
  <span id="fresh" class="fresh">loading</span>
  <button id="theme" title="dark or light">light</button>
</header>

<nav id="jump"><a href="#top-model">v2 today</a><a href="#top-map">map</a><a href="#top-gauges">gauges</a><a href="#top-score">score</a></nav>
<main>
  <!-- 1. what the model says today: will not rain, will rain, where the market disagrees, and when -->
  <span id="top-model" class="anchor"></span>
  <section id="model" class="card"></section>

  <!-- 2. the map -->
  <span id="top-map" class="anchor"></span>
  <section id="mapsec">
    <div class="maptop">
      <h3>The map</h3>
      <div class="chips" id="basemap"><button data-b="sat" class="on">satellite</button><button data-b="dark">dark</button><button data-b="radar-only">radar only</button><button id="fs-live" data-fs="map-live" title="full screen">&#x26F6; full screen</button></div>
    </div>
    <div id="map-live" class="mapbox big"><div id="mapcard" class="mapcard hidden"></div></div>
    <div class="radarctl" id="ctl-live"></div>
    <div class="legend" id="legend-live"></div>
  </section>

  <!-- 3. every gauge, sorted by what needs attention, with filters -->
  <span id="top-gauges" class="anchor"></span>
  <section id="stations">
    <div class="maptop"><h3>Every gauge</h3><div class="chips" id="queue-filters"></div></div>
    <div id="live-queue" class="queue"></div>
  </section>

  <!-- 4. the scorecard, folded -->
  <span id="top-score" class="anchor"></span>
  <section id="score">
    <details class="card" id="sc-details"><summary><b>Scorecard: what settled, and what v2's numbers have been worth</b><span>open</span></summary>
      <h3>Today, settled or wet</h3>
      <div id="sc-today"></div>
      <h3>v2 physics model, out of sample by date</h3>
      <div id="sc-physics"></div>
      <p class="note" id="sc-note"></p>
      <h3>Every source, from 9am snapshots</h3>
      <div id="sc-sources"></div>
    </details>
  </section>
</main>

<!-- the airport panel: one gauge, full screen, opened from any marker or row -->
<div id="airport" class="panel hidden">
  <div class="paneltop">
    <button id="ap-close">&#8592; board</button>
    <div class="selector"><button id="ap-prev" title="previous gauge">&#9664;</button><select id="ap-select"></select><button id="ap-next" title="next gauge">&#9654;</button></div>
  </div>
  <div class="panelbody">
    <div id="ap-decision" class="decision"></div>
    <div id="map-airport" class="mapbox"></div>
    <div class="chips"><button id="fs-airport" data-fs="map-airport" title="full screen">&#x26F6; full screen</button></div>
    <div class="radarctl" id="ctl-airport"></div>
    <div class="legend" id="legend-airport"></div>
    <h3>Today by the hour</h3>
    <div id="ap-hours"></div>
    <h3>Evidence</h3>
    <div id="ap-stack" class="stack"></div>
    <h3>Cameras</h3>
    <div id="ap-cams" class="camgrid"></div>
  </div>
</div>

<div id="sheet" class="sheet hidden"></div>
<div id="toast"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js?v=0cbe61076e"></script>
</body>
</html>
